name: ALOAPI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aloapi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node.js ${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 22.x
            node-version-file: .nvmrc
          - label: 24.x
            node-version: 24.x
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ matrix.node-version-file }}
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Validate callback-only Caddy routing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y caddy
          node --test tests/caddy-policy.test.cjs

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Check standalone bundle
        run: |
          cmp VERSION .next/standalone/VERSION
          test ! -e .next/standalone/.git
          test ! -e .next/standalone/.env
          test -f .next/standalone/.env.example

      - name: End-to-end runtime and browser tests
        run: npm run test:e2e

  offline-adapters:
    name: Offline speech and retrieval adapters
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install reviewed binary wheels in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/adapter-env"
          "$RUNNER_TEMP/adapter-env/bin/pip" install --only-binary=:all: --require-hashes -r ecosystem/requirements-linux-py311.txt
          "$RUNNER_TEMP/adapter-env/bin/pip" check
      - name: Verify upstream public fixture and run local adapters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/cmusphinx/pocketsphinx/contents/test/data/goforward.raw?ref=f20ff1b7a5db64c5e892a798479e20df86e79a35' --jq .content | base64 -d > "$RUNNER_TEMP/goforward.raw"
          "$RUNNER_TEMP/adapter-env/bin/python" tests/ecosystem-adapters.py "$RUNNER_TEMP/goforward.raw"
